    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        
      html, body {
        background: radial-gradient(circle at top right, rgba(94, 106, 210, 0.15) 0%, #0e0f11 60%);
      }

        overflow: hidden;
      }
      body {
        width: 1920px;
        height: 1080px;
        font-family: "Inter", sans-serif;
      }

      [data-composition-id="tweet5"] .x-card {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 880px;
        background: #15202b;
        border-radius: 20px;
        padding: 36px 36px 28px;
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
        border: 1px solid #38444d;
        overflow: hidden;
      }

      /* Bottom glow */
      [data-composition-id="tweet5"] .x-card::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 80px;
        background: linear-gradient(to top, rgba(29, 155, 240, 0.08), transparent);
        pointer-events: none;
      }

      /* Header row */
      [data-composition-id="tweet5"] .post-header {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        margin-bottom: 18px;
        position: relative;
      }

      [data-composition-id="tweet5"] .avatar {
        width: 52px;
        height: 52px;
        flex-shrink: 0;
        border-radius: 50%;
        overflow: hidden;
      }

      [data-composition-id="tweet5"] .avatar svg {
        width: 52px;
        height: 52px;
        display: block;
      }

      [data-composition-id="tweet5"] .user-info {
        display: flex;
        flex-direction: column;
        gap: 2px;
        flex: 1;
      }

      [data-composition-id="tweet5"] .name-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      [data-composition-id="tweet5"] .display-name {
        font-size: 26px;
        font-weight: 700;
        color: #e7e9ea;
        line-height: 1.3;
      }

      [data-composition-id="tweet5"] .verified-badge svg {
        width: 22px;
        height: 22px;
        display: block;
      }

      [data-composition-id="tweet5"] .handle {
        font-size: 22px;
        font-weight: 400;
        color: #8b98a5;
        line-height: 1.3;
      }

      /* X logo top-right */
      [data-composition-id="tweet5"] .x-logo {
        position: absolute;
        top: 2px;
        right: 0;
        width: 32px;
        height: 32px;
      }

      [data-composition-id="tweet5"] .x-logo svg {
        width: 32px;
        height: 32px;
        display: block;
      }

      /* Tweet body */
      [data-composition-id="tweet5"] .tweet-body {
        font-size: 30px;
        font-weight: 400;
        color: #e7e9ea;
        line-height: 1.45;
        margin-bottom: 12px;
        display: -webkit-box;
        -webkit-line-clamp: 4;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      [data-composition-id="tweet5"] .hashtag {
        color: #1d9bf0;
      }

      /* Timestamp */
      [data-composition-id="tweet5"] .timestamp {
        font-size: 22px;
        color: #8b98a5;
        padding-bottom: 20px;
        border-bottom: 1px solid #38444d;
        margin-bottom: 16px;
      }

      /* Metrics bar — matches real X spacing */
      [data-composition-id="tweet5"] .metrics-bar {
        display: flex;
        align-items: center;
        padding: 0;
        position: relative;
        z-index: 1;
      }

      [data-composition-id="tweet5"] .metrics-left {
        display: flex;
        align-items: center;
        flex: 1;
        justify-content: space-between;
        padding-right: 60px;
      }

      [data-composition-id="tweet5"] .metrics-right {
        display: flex;
        align-items: center;
        gap: 20px;
      }

      [data-composition-id="tweet5"] .metric {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      [data-composition-id="tweet5"] .metric-icon {
        width: 35px;
        height: 35px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      [data-composition-id="tweet5"] .metric-icon svg {
        width: 35px;
        height: 35px;
        display: block;
      }

      [data-composition-id="tweet5"] .metric-count {
        font-size: 20px;
        font-weight: 400;
        color: #8b98a5;
      }
    
    @keyframes shimmer {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }
    mark {
      background: linear-gradient(90deg, #1d9bf0, #4ade80, #f91880, #1d9bf0);
      background-size: 200% auto;
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      animation: shimmer 1.5s linear infinite;
      font-weight: 700;
      text-shadow: 0 0 20px rgba(29, 155, 240, 0.3);
    }
    /* Let the card expand with long text */
    [data-composition-id^="tweet"] .tweet-body {
        -webkit-line-clamp: 10;
    }
</style>
  </head>
  <body>

        <!-- Tweet body: prompt to replace with your content -->

        <!-- Metrics bar -->

          <div class="metrics-left">
            <!-- Reply -->
            <div class="metric">

                  <path
                    d="M1.751 10c0-4.42 3.584-8 8.005-8h4.366c4.49 0 8.129 3.64 8.129 8.13 0 2.96-1.607 5.68-4.196 7.11l-8.054 4.46v-3.69h-.067c-4.49.1-8.183-3.51-8.183-8.01zm8.005-6c-3.317 0-6.005 2.69-6.005 6 0 3.37 2.77 6.08 6.138 6.01l.351-.01h1.761v2.3l5.087-2.81c1.951-1.08 3.163-3.13 3.163-5.36 0-3.39-2.744-6.13-6.129-6.13H9.756z"
                  />
                </svg>
              </div>
              <span class="metric-count">34</span>

            <!-- Repost -->
            <div class="metric">
              <div class="metric-icon">
                <svg viewBox="0 0 24 24" fill="#8b98a5">
                  <path
                    d="M4.5 3.88l4.432 4.14-1.364 1.46L5.5 7.55V16c0 1.1.896 2 2 2H13v2H7.5c-2.209 0-4-1.79-4-4V7.55L1.432 9.48.068 8.02 4.5 3.88zM16.5 6H11V4h5.5c2.209 0 4 1.79 4 4v8.45l2.068-1.93 1.364 1.46-4.432 4.14-4.432-4.14 1.364-1.46 2.068 1.93V8c0-1.1-.896-2-2-2z"

      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      var tl = gsap.timeline({ paused: true });

      var card = document.getElementById("card");
      var likeBtn = document.getElementById("like-btn");
      var heartOutline = document.getElementById("heart-outline");
      var heartFilled = document.getElementById("heart-filled");
      var likeCount = document.getElementById("like-count");

      // Dynamic Centering & Scaling
      var dx = 0, dy = 0;
      var scale = 1.4;
      var mark = document.querySelector("mark");
      if (mark) {
        var rect = mark.getBoundingClientRect();
        var cx = rect.left + rect.width / 2;
        var cy = rect.top + rect.height / 2;
        // The card is naturally centered at 960, 540 at scale 1.0.
        // Calculate where the mark center will be AFTER scaling by 1.4
        var cx_scaled = 960 + (cx - 960) * scale;
        var cy_scaled = 540 + (cy - 540) * scale;
        
        dx = 960 - cx_scaled;
        dy = 540 - cy_scaled;
      }

      gsap.set(card, { x: dx, y: dy + 400, opacity: 0, scale: scale });

      tl.to(card, { x: dx, y: dy, opacity: 1, duration: 0.2, ease: "power3.out" }, 0.0);
      tl.to(likeBtn, { scale: 0.85, duration: 0.1, ease: "power2.out" }, 0.3);
      tl.to(likeBtn, { scale: 1, duration: 0.2, ease: "elastic.out(1, 0.4)" }, 0.4);
      tl.to(heartOutline, { opacity: 0, duration: 0.01, ease: "none" }, 0.4);
      tl.to(heartFilled, { opacity: 1, duration: 0.1, ease: "none" }, 0.4);
      tl.to(likeCount, {
        color: "#f91880", duration: 0.1, ease: "none",
        onStart: function () { likeCount.textContent = "11.0K"; }
      }, 0.4);
      tl.to(card, { x: dx, y: dy + 400, opacity: 0, duration: 0.2, ease: "power3.in" }, 0.8);

      window.__timelines["tweet5"] = tl;
    </script>
